name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Run npm audit fix
        run: npm audit fix || true

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --watchAll=false

      - name: Build Project
        run: npm run build