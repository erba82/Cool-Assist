name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: yarn install

      - name: Run yarn audit fix
        run: yarn audit fix || true

      - name: Run Lint
        run: yarn lint

      - name: Run Tests
        run: yarn test --watchAll=false

      - name: Build Project
        run: yarn build